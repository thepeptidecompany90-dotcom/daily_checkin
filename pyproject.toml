[project]
name = "glp1-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "deexith", email = "dikki6067@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "pipecat-ai[cartesia,daily,deepgram,openai,runner,silero,webrtc]>=1.8.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 115
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
