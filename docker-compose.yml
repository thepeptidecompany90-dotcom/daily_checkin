services:
  db:
    image: postgres:16-alpine
    container_name: glp1-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: glp1
    ports:
      - "5432:5432"
    volumes:
      - glp1_pgdata:/var/lib/postgresql/data
      - ./src/glp1_agent/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  glp1_pgdata:
